[project]
name = "image-to-cash"
version = "0.1.0"
description = "Turn a single order image into a verified Order and linked Invoice in Fakturama."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "pillow>=10.4",
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-applicationservices>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.3 ; sys_platform == 'darwin'",
    "uiautomation>=2.0.20 ; sys_platform == 'win32'",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "winrt-runtime>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
image-to-cash = "image_to_cash.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_to_cash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "macos: needs macOS system frameworks (Vision, Accessibility)",
    "windows: needs Windows (UI Automation, Win32, Windows OCR)",
]
